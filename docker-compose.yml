services:
  # ----------------------------------------------------------------------------
  # MongoDB - Persistent Multi-Turn Conversation & Telemetry Database
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: securechat-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - securechat-network
    # Only bind to localhost on host for local administrative debugging if needed
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Detection Service - Machine Learning Linear SVM Prompt Injection Microservice
  # ----------------------------------------------------------------------------
  detection-service:
    build:
      context: ./detection-service
      dockerfile: Dockerfile
    container_name: securechat-detection-service
    restart: unless-stopped
    environment:
      - DETECTION_SERVICE_PORT=8000
    networks:
      - securechat-network
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Backend - Express.js REST API with Security Guardrails
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securechat-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      detection-service:
        condition: service_healthy
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5173
      - MONGODB_URI=mongodb://mongodb:27017/securechat_ai
      - DETECTION_SERVICE_URL=http://detection-service:8000
      - DETECTION_TIMEOUT_MS=${DETECTION_TIMEOUT_MS:-1500}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
      - OLLAMA_TIMEOUT_MS=${OLLAMA_TIMEOUT_MS:-120000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - securechat-network
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # Frontend - ChatGPT-Style React Client served via Nginx Reverse Proxy
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securechat-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - securechat-network
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  mongodb_data:
    name: securechat_mongodb_data

# ------------------------------------------------------------------------------
# Internal Bridge Network
# ------------------------------------------------------------------------------
networks:
  securechat-network:
    name: securechat-network
    driver: bridge
